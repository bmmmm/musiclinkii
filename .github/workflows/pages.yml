# Static site → GitHub Pages. Tests gate the deploy.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test 'tests/*.test.mjs'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # index.html ships asset references marked v=dev; stamp them with the
      # commit SHA so HTML, CSS and the module chain always come from one
      # deploy. Counted before and after: a silently non-matching sed would
      # otherwise deploy uncacheable-busted assets and look like success.
      - name: Stamp cache-buster
        run: |
          before=$(grep -o '?v=dev' index.html | wc -l)
          test "$before" -ge 8 || { echo "expected >=8 cache-buster refs, found $before"; exit 1; }
          sed -i "s/?v=dev/?v=${GITHUB_SHA:0:12}/g" index.html
          test "$(grep -c '?v=dev' index.html || true)" -eq 0 || { echo "stamping left placeholders behind"; exit 1; }
          echo "stamped $before refs with ${GITHUB_SHA:0:12}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
